name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, types, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      # pdftoppm renders exported PDFs in the placement tests.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils
      # No dependency runs code at install: the only install scripts are
      # tesseract.js's donation banner and macOS-only fsevents. Playwright's
      # browser is installed in its own step.
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run build

  e2e:
    name: Browser verify (Chromium, axe, preview ≡ PDF)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils
      # No dependency runs code at install: the only install scripts are
      # tesseract.js's donation banner and macOS-only fsevents. Playwright's
      # browser is installed in its own step.
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run verify
        env:
          SHOTS: shots
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verify-screenshots
          path: shots
          if-no-files-found: ignore
